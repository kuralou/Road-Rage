<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Road Rage</title>
    
    <style>
        /* General Body Setup */
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background-color: #60BFFF; /* Matches your sky color */
        }
        canvas { display: block; }

        /* Container for the whole screen */
        #start-screen {
            position: absolute;
            inset: 0; /* Same as top/left/right/bottom 0 */
            overflow: hidden;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #2A3D3A; /* Fallback color */
            transition: opacity 0.5s ease-out;
        }

        /* BACKGROUND: Resizes dynamically, covers entire screen, no repeat */
        #bg-layer {
            position: absolute;
            inset: 0;
            background-image: url('./assets/loading_background-CNPN-voo.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
        }

        /* GRASS: Slides up from very bottom */
        #grass-layer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100vw;
            height: auto;
            z-index: 2;
            transform: translateY(100%);
            animation: slideUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards 0.1s; /* Starts first with bounce easing */
        }

        /* CARS: Large, bottom center, slides up after grass */
        #cars-layer {
            position: absolute;
            bottom: -10%; /* Lower on screen */
            left: 50%;
            width: 90vw; /* Quite large */
            max-width: 800px;
            z-index: 3;
            transform: translate(-50%, 100%);
            animation: slideUpCenter 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) forwards 1.2s; /* Starts after grass with bounce easing */
        }

        /* LOGO: Top middle, Slaps onto the screen with a bounce */
        #logo-layer {
            position: absolute;
            top: 2%;
            left: 50%;
            width: 60vw;
            max-width: 450px;
            z-index: 4;
            opacity: 0;
            transform: translate(-50%, 0) scale(3); /* Starts huge */
            /* cubic-bezier gives it that bouncy "slap" effect */
            animation: slapIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards 1.6s; /* Starts later with more delay */
        }

        /* PLAY BUTTON: Red with white borders */
        #start-btn {
            position: absolute;
            bottom: 15%;
            z-index: 5;
            background-color: #E60000;
            color: white;
            border: 6px solid white;
            border-radius: 12px;
            padding: 15px 40px;
            font-size: 2.5rem;
            font-family: sans-serif;
            font-weight: 900;
            text-transform: uppercase;
            box-shadow: 0px 8px 0px rgba(0,0,0,0.5);
            cursor: pointer;
            opacity: 0;
            transform: scale(0.8);
            animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards 2.2s; /* Appears last with bounce easing */
        }

        /* Button hover effect */
        #start-btn:hover:not(:disabled) {
            transform: scale(1.1);
            background-color: #ff1a1a;
        }
        
        #start-btn:active:not(:disabled) {
            transform: scale(1) translateY(4px);
            box-shadow: 0px 4px 0px rgba(0,0,0,0.5);
        }

        #start-btn:disabled {
            background-color: #888;
            border-color: #aaa;
            cursor: wait;
        }

        /* --- THE ANIMATIONS --- */
        @keyframes slideUp {
            to { transform: translateY(0); }
        }
        @keyframes slideUpCenter {
            to { transform: translate(-50%, 0); }
        }
        @keyframes slapIn {
            to { opacity: 1; transform: translate(-50%, 0) scale(1); }
        }
        @keyframes popIn {
            to { opacity: 1; transform: scale(1); }
        }
    </style>
<script type="module" crossorigin src="./assets/index-CKf1VNas.js"></script></head>
<body>

    <div id="start-screen">
        <div id="bg-layer"></div>
        <img src="./assets/grass_slide_up-DjC5CdgS.png" id="grass-layer" alt="grass" />
        <img src="./assets/cars_slide_up-BbiEC9Nu.png" id="cars-layer" alt="cars" />
        <img src="./assets/roadrage_logo-CfYAugbR.png" id="logo-layer" alt="logo" />
        <button id="start-btn" disabled>LOADING...</button>
    </div>

    <div id="game-container"></div>
    
</body>
</html>
